<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"><style>
text{fill:#1d2623;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:12.5px}
.code{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px}
.title{font-weight:600;font-size:14px}
.dim{fill:#5c6a65}.acc{fill:#0b7a6b}.bad{fill:#b3261e}.ital{font-style:italic}.big{font-size:18px;font-weight:600}
.box{fill:#fff;stroke:#1d2623;stroke-width:1.2}
.abs{fill:#e0f1ee;stroke:#0b7a6b;stroke-width:2;stroke-dasharray:7 4}
.priv{fill:#e0f1ee;stroke:#b3261e;stroke-width:1.6}
.rule{stroke:#c9d1cd;stroke-width:1}
.flow{stroke:#5c6a65;stroke-width:1.3;fill:none}
.make{stroke:#5c6a65;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.contract{stroke:#0b7a6b;stroke-width:2.2;fill:none}
.blocked{stroke:#b3261e;stroke-width:2;fill:none;stroke-dasharray:6 4}
.inherit{stroke:#1d2623;stroke-width:1.3;fill:none}
.head-flow{fill:#5c6a65}.head-contract{fill:#0b7a6b}
.head-inherit{fill:#f6f7f5;stroke:#1d2623;stroke-width:1.3}
</style><rect width="100%" height="100%" fill="#f6f7f5"/>
        <defs>
          <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon class="head-flow" points="0,0 10,5 0,10"/></marker>
          <marker id="a-contract" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon class="head-contract" points="0,0 10,5 0,10"/></marker>
          <marker id="a-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><polygon class="head-inherit" points="1,1 11,6 1,11"/></marker>
        </defs>

        <!-- column headings -->
        <text x="20" y="22" class="dim">CÓDIGO CLIENTE</text>
        <text x="360" y="22" class="dim">ABSTRACCIÓN</text>
        <text x="700" y="22" class="dim">IMPLEMENTACIONES</text>

        <!-- client column -->
        <rect x="20" y="50" width="220" height="70" rx="3" class="box"/>
        <text x="34" y="74" class="title">dibujar()</text>
        <text x="34" y="94" class="code">m.hacerSonido()</text>
        <text x="34" y="110" class="dim">para cada m de pacientes</text>

        <rect x="20" y="170" width="220" height="56" rx="3" class="box"/>
        <text x="34" y="194" class="title">pacientes</text>
        <text x="34" y="212" class="code">Mascota[]</text>

        <rect x="20" y="320" width="220" height="80" rx="3" class="box"/>
        <text x="34" y="344" class="title">submit del formulario</text>
        <text x="34" y="364" class="code">tipo === "perro"</text>
        <text x="34" y="380" class="code">? new Perro : new Gato</text>

        <!-- client flow -->
        <line x1="130" y1="320" x2="130" y2="228" class="flow" marker-end="url(#a-flow)"/>
        <text x="140" y="280" class="dim">push(mascota)</text>
        <line x1="130" y1="170" x2="130" y2="122" class="flow" marker-end="url(#a-flow)"/>
        <text x="140" y="150" class="dim">lee la lista</text>

        <!-- abstract class -->
        <rect x="360" y="50" width="260" height="200" rx="3" class="abs"/>
        <text x="376" y="74" class="title">Mascota</text>
        <text x="448" y="74" class="dim">«abstracta»</text>
        <line x1="360" y1="86" x2="620" y2="86" class="rule"/>
        <text x="376" y="106" class="code">nombre, #peso (privado)</text>
        <line x1="360" y1="120" x2="620" y2="120" class="rule"/>
        <text x="376" y="140" class="code acc">hacerSonido()</text>
        <text x="376" y="157" class="dim">contrato: lanza Error si una</text>
        <text x="376" y="173" class="dim">subclase no lo sobrescribe</text>
        <line x1="360" y1="188" x2="620" y2="188" class="rule"/>
        <text x="376" y="208" class="code">constructor()</text>
        <text x="376" y="225" class="dim">new.target === Mascota</text>
        <text x="376" y="241" class="dim">lanza TypeError</text>

        <!-- contract dependency -->
        <line x1="240" y1="85" x2="358" y2="85" class="contract" marker-end="url(#a-contract)"/>
        <text x="249" y="76" class="code acc">depende de</text>

        <!-- concrete classes -->
        <rect x="700" y="50" width="200" height="80" rx="3" class="box"/>
        <text x="714" y="74" class="title">Perro</text>
        <text x="714" y="96" class="code">hacerSonido()</text>
        <text x="714" y="114" class="dim">devuelve "Guau Guau"</text>

        <rect x="700" y="190" width="200" height="80" rx="3" class="box"/>
        <text x="714" y="214" class="title">Gato</text>
        <text x="714" y="236" class="code">hacerSonido()</text>
        <text x="714" y="254" class="dim">devuelve "Miau Miau"</text>

        <!-- inheritance -->
        <line x1="700" y1="90" x2="622" y2="90" class="inherit" marker-end="url(#a-inherit)"/>
        <text x="632" y="80" class="dim">extends</text>
        <line x1="700" y1="230" x2="622" y2="230" class="inherit" marker-end="url(#a-inherit)"/>
        <text x="632" y="220" class="dim">extends</text>

        <!-- construction: the only place that knows the concrete classes -->
        <polyline points="240,360 800,360 800,272" class="make" marker-end="url(#a-flow)"/>
        <polyline points="640,360 935,360 935,90 902,90" class="make" marker-end="url(#a-flow)"/>
        <text x="260" y="352" class="code">new Perro(nombre, peso)  /  new Gato(nombre, peso)</text>
        <text x="260" y="388" class="dim">único punto del programa que nombra las clases concretas</text>
      </svg>