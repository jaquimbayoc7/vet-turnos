<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"><style>
text{fill:#1d2623;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:12.5px}
.code{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px}
.title{font-weight:600;font-size:14px}
.dim{fill:#5c6a65}.acc{fill:#0b7a6b}.bad{fill:#b3261e}.ital{font-style:italic}.big{font-size:18px;font-weight:600}
.box{fill:#fff;stroke:#1d2623;stroke-width:1.2}
.abs{fill:#e0f1ee;stroke:#0b7a6b;stroke-width:2;stroke-dasharray:7 4}
.priv{fill:#e0f1ee;stroke:#b3261e;stroke-width:1.6}
.rule{stroke:#c9d1cd;stroke-width:1}
.flow{stroke:#5c6a65;stroke-width:1.3;fill:none}
.make{stroke:#5c6a65;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.contract{stroke:#0b7a6b;stroke-width:2.2;fill:none}
.blocked{stroke:#b3261e;stroke-width:2;fill:none;stroke-dasharray:6 4}
.inherit{stroke:#1d2623;stroke-width:1.3;fill:none}
.head-flow{fill:#5c6a65}.head-contract{fill:#0b7a6b}
.head-inherit{fill:#f6f7f5;stroke:#1d2623;stroke-width:1.3}
</style><rect width="100%" height="100%" fill="#f6f7f5"/>
        <defs>
          <marker id="e-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon class="head-flow" points="0,0 10,5 0,10"/></marker>
          <marker id="e-contract" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon class="head-contract" points="0,0 10,5 0,10"/></marker>
        </defs>

        <!-- column headings -->
        <text x="20" y="22" class="dim">CÓDIGO EXTERNO</text>
        <text x="330" y="22" class="dim">CLASE CON CAMPO PRIVADO</text>
        <text x="690" y="22" class="dim">QUÉ LO PROTEGE</text>

        <!-- ===== Row 1: Mascota.#peso ===== -->
        <rect x="20" y="50" width="220" height="56" rx="3" class="box"/>
        <text x="34" y="74" class="code">mascota.peso = 12</text>
        <text x="34" y="94" class="dim">pasa por el setter</text>

        <rect x="20" y="140" width="220" height="56" rx="3" class="box"/>
        <text x="34" y="164" class="code">mascota.#peso = -5</text>
        <text x="34" y="184" class="dim bad">SyntaxError: campo privado</text>

        <rect x="330" y="40" width="300" height="180" rx="3" class="box"/>
        <text x="346" y="64" class="title">Mascota</text>
        <text x="346" y="84" class="dim">interfaz pública</text>
        <text x="346" y="104" class="code acc">get peso()</text>
        <text x="346" y="124" class="code acc">set peso(valor)</text>
        <line x1="330" y1="136" x2="630" y2="136" class="rule"/>
        <rect x="346" y="148" width="268" height="58" rx="3" class="priv"/>
        <text x="360" y="170" class="code">#peso</text>
        <text x="360" y="190" class="dim">privado: solo accesible dentro de la clase</text>

        <line x1="240" y1="78" x2="328" y2="118" class="contract" marker-end="url(#e-contract)"/>
        <line x1="240" y1="168" x2="300" y2="172" class="blocked"/>
        <text x="304" y="178" class="big bad">✕</text>

        <rect x="690" y="50" width="240" height="130" rx="3" class="box"/>
        <text x="704" y="74" class="title">Validación en el setter</text>
        <text x="704" y="96" class="code">typeof valor !== "number"</text>
        <text x="704" y="112" class="code">valor &lt;= 0 || isNaN(valor)</text>
        <text x="704" y="136" class="dim">si falla, lanza RangeError</text>
        <text x="704" y="154" class="dim">nunca queda un peso inválido</text>
        <line x1="632" y1="114" x2="688" y2="114" class="flow" marker-end="url(#e-flow)"/>
        <text x="634" y="106" class="dim">valida</text>

        <!-- ===== Row 2: Clinica.#pacientes ===== -->
        <rect x="20" y="250" width="220" height="56" rx="3" class="box"/>
        <text x="34" y="274" class="code">clinica.registrar(m)</text>
        <text x="34" y="294" class="dim">único camino para agregar</text>

        <rect x="20" y="330" width="220" height="56" rx="3" class="box"/>
        <text x="34" y="354" class="code">clinica.pacientes.push(x)</text>
        <text x="34" y="374" class="dim">solo modifica una copia</text>

        <rect x="330" y="240" width="300" height="165" rx="3" class="box"/>
        <text x="346" y="264" class="title">Clinica</text>
        <text x="346" y="286" class="code acc">registrar(mascota)</text>
        <text x="346" y="306" class="code acc">get pacientes</text>
        <text x="470" y="306" class="dim">devuelve [...#pacientes]</text>
        <line x1="330" y1="320" x2="630" y2="320" class="rule"/>
        <rect x="346" y="332" width="268" height="60" rx="3" class="priv"/>
        <text x="360" y="354" class="code">#pacientes</text>
        <text x="360" y="376" class="dim">arreglo privado, nunca se expone</text>

        <line x1="240" y1="278" x2="328" y2="282" class="contract" marker-end="url(#e-contract)"/>
        <line x1="240" y1="358" x2="328" y2="305" class="contract" marker-end="url(#e-contract)"/>

        <rect x="690" y="250" width="240" height="130" rx="3" class="box"/>
        <text x="704" y="274" class="title">Dos defensas</text>
        <text x="704" y="298" class="dim">registrar: TypeError si no es</text>
        <text x="704" y="314" class="dim">una instancia de Mascota</text>
        <text x="704" y="342" class="dim">get: entrega una copia,</text>
        <text x="704" y="358" class="dim">no el arreglo original</text>
        <line x1="632" y1="290" x2="688" y2="290" class="flow" marker-end="url(#e-flow)"/>
      </svg>