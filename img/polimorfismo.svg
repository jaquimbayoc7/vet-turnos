<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440"><style>
text{fill:#1d2623;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:12.5px}
.code{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px}
.sm{font-size:11px}
.title{font-weight:600;font-size:14px}
.dim{fill:#5c6a65}.acc{fill:#0b7a6b}
.box{fill:#fff;stroke:#1d2623;stroke-width:1.2}
.abs{fill:#e0f1ee;stroke:#0b7a6b;stroke-width:2;stroke-dasharray:7 4}
.rule{stroke:#c9d1cd;stroke-width:1}
.flow{stroke:#5c6a65;stroke-width:1.3;fill:none}
.head-flow{fill:#5c6a65}
</style><rect width="100%" height="100%" fill="#f6f7f5"/>
<defs>
  <marker id="p-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><polygon class="head-flow" points="0,0 10,5 0,10"/></marker>
</defs>

<text x="20" y="22" class="dim">QUIEN LLAMA</text>
<text x="330" y="22" class="dim">CONTRATO</text>
<text x="562" y="22" class="dim">CADA CLASE RESPONDE A SU MANERA</text>

<!-- caller -->
<rect x="20" y="120" width="250" height="170" rx="3" class="box"/>
<text x="36" y="144" class="title">dibujar()</text>
<line x1="20" y1="156" x2="270" y2="156" class="rule"/>
<text x="36" y="178" class="code sm">for (const m of pacientes) {</text>
<text x="36" y="196" class="code sm">  m.describir()</text>
<text x="36" y="214" class="code sm">  m.hacerSonido()</text>
<text x="36" y="232" class="code sm">  m.calcularConsulta()</text>
<text x="36" y="250" class="code sm">}</text>
<text x="36" y="274" class="dim">nunca pregunta la especie</text>

<!-- contract -->
<rect x="320" y="120" width="190" height="170" rx="3" class="abs"/>
<text x="336" y="144" class="title">Mascota</text>
<text x="400" y="144" class="dim">«abstracta»</text>
<line x1="320" y1="156" x2="510" y2="156" class="rule"/>
<text x="336" y="180" class="code acc">hacerSonido()</text>
<text x="336" y="204" class="code acc">calcularConsulta()</text>
<text x="336" y="228" class="code">describir()</text>
<text x="336" y="256" class="dim">si la subclase no lo</text>
<text x="336" y="272" class="dim">implementa: Error</text>

<line x1="270" y1="205" x2="318" y2="205" class="flow" marker-end="url(#p-flow)"/>

<!-- bus -->
<line x1="510" y1="205" x2="535" y2="205" class="flow"/>
<line x1="535" y1="92" x2="535" y2="352" class="flow"/>
<line x1="535" y1="92" x2="560" y2="92" class="flow" marker-end="url(#p-flow)"/>
<line x1="535" y1="222" x2="560" y2="222" class="flow" marker-end="url(#p-flow)"/>
<line x1="535" y1="352" x2="560" y2="352" class="flow" marker-end="url(#p-flow)"/>

<!-- Perro -->
<rect x="562" y="36" width="378" height="112" rx="3" class="box"/>
<text x="576" y="60" class="title">Perro</text>
<line x1="562" y1="70" x2="940" y2="70" class="rule"/>
<text x="576" y="92" class="code sm">hacerSonido()  →  "Guau Guau"</text>
<text x="576" y="112" class="code sm">calcularConsulta()  →  30000 + peso * 1000</text>
<text x="576" y="134" class="dim">Rex, 12 Kg: $.42.000</text>

<!-- Gato -->
<rect x="562" y="166" width="378" height="112" rx="3" class="box"/>
<text x="576" y="190" class="title">Gato</text>
<line x1="562" y1="200" x2="940" y2="200" class="rule"/>
<text x="576" y="222" class="code sm">hacerSonido()  →  "Miau Miau"</text>
<text x="576" y="242" class="code sm">calcularConsulta()  →  35000 (fijo)</text>
<text x="576" y="264" class="dim">Misu, 4 Kg: $.35.000</text>

<!-- Ave -->
<rect x="562" y="296" width="378" height="112" rx="3" class="box"/>
<text x="576" y="320" class="title">Ave</text>
<line x1="562" y1="330" x2="940" y2="330" class="rule"/>
<text x="576" y="352" class="code sm">hacerSonido()  →  "Pío Pío"</text>
<text x="576" y="372" class="code sm">calcularConsulta()  →  puedeVolar ? 25000 : 32000</text>
<text x="576" y="394" class="dim">Pío, puede volar: $.25.000</text>

<!-- total -->
<rect x="20" y="340" width="250" height="68" rx="3" class="box"/>
<text x="36" y="362" class="title">Clinica.totalDia()</text>
<text x="36" y="382" class="code sm">reduce(suma + m.calcularConsulta())</text>
<text x="36" y="398" class="dim">42000 + 35000 + 25000 = 102000</text>
<line x1="145" y1="292" x2="145" y2="338" class="flow" marker-end="url(#p-flow)"/>
<text x="20" y="430" class="dim">Misma llamada, distinto resultado según la clase concreta del objeto.</text>
</svg>
