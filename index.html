<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Turnos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
  
    <main>
        <h1>Bienvenido a Vet Turnos</h1>

        <form id="formulario">
            <label>Tipo de Mascota
                <select id="tipo">
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                </select>
            </label>
            <label>Nombre de la Mascota
                <input type="text" id="nombre" required placeholder="Ingrese el nombre de la mascota">
            </label>
             <label>Peso (Kg) de la Mascota
                <input type="number" id="peso" required placeholder="Ingrese el peso de la mascota" step="0.1">
            </label>
            <button type="submit">Registrar</button>
            <div id="mensaje"></div>
        </form>

        <ul id="lista"></ul>
    </main>
    <script src="programa.js"></script>
</body>
</html>
