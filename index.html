<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Turnos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
  
    <main>
        <h1>Bienvenido a Vet Turnos</h1>

        <form id="formulario">
            <label>Tipo de Mascota
                <select id="tipo">
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Ave">Ave</option>
                </select>
            </label>
            <label>Nombre de la Mascota
                <input type="text" id="nombre" required placeholder="Ingrese el nombre de la mascota">
            </label>
             <label>Peso (Kg) de la Mascota
                <input type="number" id="peso" required placeholder="Ingrese el peso de la mascota" step="0.01">
            </label>
            <label>
                <span id="etiqueta">Raza</span>
                <select id="extra">
                </select>
            </label>
            <button type="submit">Registrar</button>
            <div id="mensaje"></div>
        </form>

        <ul id="lista"></ul>
        <p id="total"></p>

    </main>
    <!-- Script principal de la aplicación 
    1. Abstracción solo 
    <script src="programa.js"></script> 
    -->
    <!-- 2. Script de abstracción + Encapsulamiento <script src="abs.js"></script>  -->

    <!-- 3. Script de Abstracción + Encapsulamiento + Herencia -->
     <script src="herencia.js"></script>
    
</body>
</html>
